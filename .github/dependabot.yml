# Avisos de atualização de dependências (mensal, para economizar minutos de CI)
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /caroline-macedo-advocacia
      - /radar-ba
      - /onboarding/cadastro-astrea
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /cm-calculadora
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

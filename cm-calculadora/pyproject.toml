[project]
name = "cm-calc"
version = "0.6.10"
description = "CM | Calculadora Judicial Bancária — motor matemático (uso interno, Caroline Macedo Advocacia)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.9,<3",
    "pymupdf>=1.24",
    "streamlit>=1.40",
]

[project.scripts]
cm-calc = "cm_calc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cm_calc"]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
